[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-replay"
version = "3.2.0"
description = "Contract-complete defensive telemetry replay with differential correctness proofs and verifiable evidence bundles."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Florian Stuettgen" }]
keywords = ["security", "soc", "telemetry", "detection-engineering", "cyber-range", "replay"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
soc-replay = "soc_replay.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soc_replay = ["py.typed"]

[project.urls]
Homepage = "https://github.com/FlorianStuettgen/SOC_Replay"
Repository = "https://github.com/FlorianStuettgen/SOC_Replay"
Issues = "https://github.com/FlorianStuettgen/SOC_Replay/issues"
Documentation = "https://github.com/FlorianStuettgen/SOC_Replay/tree/main/docs"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "coverage[toml]>=7.6,<8",
  "jsonschema[format]>=4.23,<5",
  "mypy>=1.10,<2",
  "ruff>=0.6,<1",
  "setuptools>=80,<81",
  "wheel>=0.45,<1",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/soc_replay"]

[tool.coverage.run]
branch = true
source = ["soc_replay"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
