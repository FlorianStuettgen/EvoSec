name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/diagnostics
          set +e
          ruff check src tests tools --output-format=concise 2>&1 | tee build/diagnostics/ruff.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Type check
        id: typing
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/diagnostics
          set +e
          mypy 2>&1 | tee build/diagnostics/mypy.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Compile
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/diagnostics
          set +e
          python -m compileall src tests tools 2>&1 | tee build/diagnostics/compile.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Test with branch coverage
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/diagnostics
          set +e
          {
            coverage run -m unittest discover -s tests -v
            test_status=$?
            coverage report
            coverage_status=$?
            if [ "${test_status}" -ne 0 ]; then
              exit "${test_status}"
            fi
            exit "${coverage_status}"
          } 2>&1 | tee build/diagnostics/tests.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Inspect execution and contract wiring
        run: |
          soc-replay doctor
          soc-replay graph --format mermaid
          soc-replay adapters
      - name: Verify exact scenario contracts
        run: |
          soc-replay verify scenarios/network-scan
          soc-replay verify scenarios/privileged-group-change
          soc-replay verify scenarios/failed-authentication-burst
          soc-replay verify scenarios/benign-privileged-change
      - name: Prove indexed and full-scan equivalence
        run: |
          mkdir -p build
          python tools/verify_index_equivalence.py
          python tools/verify_index_equivalence.py --json > build/index-equivalence.json
      - name: Validate real schema instances
        run: python tools/validate_contracts.py
      - name: Exercise bundle and strict-ledger verification
        run: |
          soc-replay run scenarios/network-scan --output build/network-scan
          soc-replay verify-bundle build/network-scan
      - name: Exercise frozen adapter registry
        run: |
          soc-replay normalize --adapter suricata-eve examples/adapters/suricata-eve.jsonl build/suricata-normalized.jsonl
      - name: Verify deterministic bundle generation
        run: python tools/verify_deterministic_bundles.py
      - name: Verify repository invariants
        run: python tools/verify_repository.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Verify reproducible wheel bytes
        if: matrix.python-version == '3.13'
        run: python tools/verify_reproducible_wheel.py
      - name: Run schema-valid benchmark smoke test
        if: always() && matrix.python-version == '3.13'
        run: |
          python tools/benchmark_scenarios.py \
            --copies 4 \
            --iterations 2 \
            --warmups 1 \
            --output build/benchmarks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soc-replay-${{ matrix.python-version }}
          if-no-files-found: warn
          path: |
            dist/
            build/network-scan/
            build/index-equivalence.json
            build/benchmarks/
            build/diagnostics/
            build/reproducibility/
      - name: Enforce captured quality results
        if: always() && (steps.lint.outcome == 'failure' || steps.typing.outcome == 'failure' || steps.compile.outcome == 'failure' || steps.tests.outcome == 'failure')
        run: exit 1
