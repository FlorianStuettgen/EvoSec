name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Type check
        run: mypy
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Test with branch coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
      - name: Inspect execution wiring
        run: |
          soc-replay doctor
          soc-replay graph --format mermaid
          soc-replay adapters
      - name: Verify scenario catalog
        run: |
          soc-replay verify scenarios/network-scan
          soc-replay verify scenarios/privileged-group-change
          soc-replay verify scenarios/failed-authentication-burst
          soc-replay verify scenarios/benign-privileged-change
      - name: Exercise bundle and ledger verification
        run: |
          soc-replay run scenarios/network-scan --output build/network-scan
          soc-replay verify-bundle build/network-scan
      - name: Exercise adapter registry
        run: |
          soc-replay normalize --adapter suricata-eve examples/adapters/suricata-eve.jsonl build/suricata-normalized.jsonl
      - name: Verify deterministic bundle generation
        run: python tools/verify_deterministic_bundles.py
      - name: Verify repository invariants
        run: python tools/verify_repository.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - uses: actions/upload-artifact@v4
        with:
          name: soc-replay-${{ matrix.python-version }}
          path: |
            dist/
            build/network-scan/
