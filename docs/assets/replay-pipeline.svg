<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc"><title id="title">SOC_Replay processing pipeline</title><desc id="desc">Scenario and event files pass through validation, matching, correlation, detections, simulated actions and evidence reports.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131f"/><stop offset="1" stop-color="#0d1b29"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".35"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b6a82"/></marker></defs><rect width="1280" height="420" rx="24" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="52" y="58" fill="#e9f6ff" font-size="26" font-weight="800">Replay pipeline</text><text x="52" y="86" fill="#7f98ad" font-size="15">Every conclusion remains connected to the source event IDs that produced it.</text><g transform="translate(42 126)" filter="url(#s)"><g><rect width="170" height="192" rx="18" fill="#102437" stroke="#24506d"/><text x="20" y="34" fill="#72dff5" font-size="12" font-weight="800">INPUT</text><rect x="20" y="58" width="130" height="42" rx="10" fill="#0b1b2a"/><text x="85" y="84" fill="#edf8ff" font-size="14" font-weight="700" text-anchor="middle">scenario.json</text><rect x="20" y="114" width="130" height="42" rx="10" fill="#0b1b2a"/><text x="85" y="140" fill="#edf8ff" font-size="14" font-weight="700" text-anchor="middle">events.jsonl</text></g><line x1="170" y1="96" x2="208" y2="96" stroke="#4b6a82" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(218 0)"><rect width="170" height="192" rx="18" fill="#102437" stroke="#24506d"/><text x="20" y="34" fill="#72dff5" font-size="12" font-weight="800">VALIDATE</text><text x="20" y="72" fill="#e5f4ff" font-size="14" font-weight="700">Contract</text><text x="20" y="99" fill="#e5f4ff" font-size="14" font-weight="700">Timestamps</text><text x="20" y="126" fill="#e5f4ff" font-size="14" font-weight="700">Unique IDs</text><text x="20" y="153" fill="#86a0b4" font-size="12">simulation mode only</text></g><line x1="388" y1="96" x2="426" y2="96" stroke="#4b6a82" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(436 0)"><rect width="170" height="192" rx="18" fill="#172036" stroke="#6054a8"/><text x="20" y="34" fill="#b8a7ff" font-size="12" font-weight="800">EVALUATE</text><text x="20" y="72" fill="#f1edff" font-size="14" font-weight="700">Field matching</text><text x="20" y="99" fill="#f1edff" font-size="14" font-weight="700">Time windows</text><text x="20" y="126" fill="#f1edff" font-size="14" font-weight="700">Distinct values</text><text x="20" y="153" fill="#9e94c8" font-size="12">stable ordering</text></g><line x1="606" y1="96" x2="644" y2="96" stroke="#4b6a82" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(654 0)"><rect width="170" height="192" rx="18" fill="#2b1722" stroke="#a43a62"/><text x="20" y="34" fill="#ff9ab7" font-size="12" font-weight="800">DETECT</text><text x="20" y="72" fill="#fff0f5" font-size="14" font-weight="700">Rule ID</text><text x="20" y="99" fill="#fff0f5" font-size="14" font-weight="700">Severity</text><text x="20" y="126" fill="#fff0f5" font-size="14" font-weight="700">Evidence IDs</text><text x="20" y="153" fill="#b98b9b" font-size="12">grouped entities</text></g><line x1="824" y1="96" x2="862" y2="96" stroke="#4b6a82" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(872 0)"><rect width="170" height="192" rx="18" fill="#0e2a29" stroke="#18806e"/><text x="20" y="34" fill="#8af2d9" font-size="12" font-weight="800">RESPOND</text><text x="20" y="72" fill="#effffb" font-size="14" font-weight="700">Recommendation</text><text x="20" y="99" fill="#effffb" font-size="14" font-weight="700">Human review</text><text x="20" y="126" fill="#effffb" font-size="14" font-weight="700">No execution</text><text x="20" y="153" fill="#7fb3a8" font-size="12">mode = simulated</text></g><line x1="1042" y1="96" x2="1080" y2="96" stroke="#4b6a82" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(1090 0)"><rect width="144" height="192" rx="18" fill="#102437" stroke="#24506d"/><text x="18" y="34" fill="#72dff5" font-size="12" font-weight="800">OUTPUT</text><text x="18" y="78" fill="#e5f4ff" font-size="14" font-weight="700">report.json</text><text x="18" y="108" fill="#e5f4ff" font-size="14" font-weight="700">report.md</text><text x="18" y="145" fill="#86a0b4" font-size="12">reproducible</text></g></g></g></svg>