<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">SOC_Replay execution core</title>
  <desc id="desc">A five-stage deterministic evidence pipeline with compiled rules, indexed candidates, verification, and a hash-chained execution ledger.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1d2a"/>
      <stop offset="1" stop-color="#11251f"/>
    </linearGradient>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#13283d"/>
      <stop offset="1" stop-color="#0d1c2b"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="13" flood-opacity=".38"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f8fa5"/>
    </marker>
  </defs>
  <rect width="1500" height="760" fill="url(#bg)"/>
  <text x="60" y="62" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="34" font-weight="800">SOC_REPLAY · EXECUTION FABRIC</text>
  <text x="60" y="96" fill="#93aebe" font-family="Segoe UI,Arial" font-size="17">COMPILE ONCE · INDEX ONCE · EVALUATE DETERMINISTICALLY · VERIFY EXPLICITLY · RECORD EVERY TRANSITION</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial">
    <rect x="55" y="142" width="220" height="210" rx="20" fill="url(#stage)" stroke="#3b82f6"/><text x="82" y="180" fill="#93c5fd" font-size="14" font-weight="800">01 · LOAD</text><text x="82" y="218" fill="#f8fafc" font-size="23" font-weight="750">Immutable inputs</text><text x="82" y="252" fill="#a8bdca" font-size="14">scenario.json</text><text x="82" y="277" fill="#a8bdca" font-size="14">events.jsonl</text><text x="82" y="302" fill="#a8bdca" font-size="14">strict validation</text><text x="82" y="327" fill="#60a5fa" font-size="13" font-weight="700">SHA-256 provenance</text>
    <rect x="330" y="142" width="220" height="210" rx="20" fill="url(#stage)" stroke="#a855f7"/><text x="357" y="180" fill="#d8b4fe" font-size="14" font-weight="800">02 · COMPILE</text><text x="357" y="218" fill="#f8fafc" font-size="23" font-weight="750">Rule execution plan</text><text x="357" y="252" fill="#a8bdca" font-size="14">field accessors</text><text x="357" y="277" fill="#a8bdca" font-size="14">operator callables</text><text x="357" y="302" fill="#a8bdca" font-size="14">aggregate strategy</text><text x="357" y="327" fill="#c084fc" font-size="13" font-weight="700">semantic fingerprint</text>
    <rect x="605" y="142" width="220" height="210" rx="20" fill="url(#stage)" stroke="#14b8a6"/><text x="632" y="180" fill="#99f6e4" font-size="14" font-weight="800">03 · INDEX</text><text x="632" y="218" fill="#f8fafc" font-size="23" font-weight="750">Candidate routing</text><text x="632" y="252" fill="#a8bdca" font-size="14">category / action</text><text x="632" y="277" fill="#a8bdca" font-size="14">source / host / user</text><text x="632" y="302" fill="#a8bdca" font-size="14">tag membership</text><text x="632" y="327" fill="#2dd4bf" font-size="13" font-weight="700">semantics-preserving hints</text>
    <rect x="880" y="142" width="220" height="210" rx="20" fill="url(#stage)" stroke="#f59e0b"/><text x="907" y="180" fill="#fde68a" font-size="14" font-weight="800">04 · EVALUATE</text><text x="907" y="218" fill="#f8fafc" font-size="23" font-weight="750">Detection engine</text><text x="907" y="252" fill="#a8bdca" font-size="14">single-event rules</text><text x="907" y="277" fill="#a8bdca" font-size="14">time windows</text><text x="907" y="302" fill="#a8bdca" font-size="14">distinct thresholds</text><text x="907" y="327" fill="#fbbf24" font-size="13" font-weight="700">stable detection ordering</text>
    <rect x="1155" y="142" width="290" height="210" rx="20" fill="url(#stage)" stroke="#22c55e"/><text x="1182" y="180" fill="#bbf7d0" font-size="14" font-weight="800">05 · VERIFY</text><text x="1182" y="218" fill="#f8fafc" font-size="23" font-weight="750">Declared outcomes</text><text x="1182" y="252" fill="#a8bdca" font-size="14">detection count</text><text x="1182" y="277" fill="#a8bdca" font-size="14">rule identities</text><text x="1182" y="302" fill="#a8bdca" font-size="14">severity distribution</text><text x="1182" y="327" fill="#4ade80" font-size="13" font-weight="700">machine-verifiable PASS / FAIL</text>
  </g>
  <g stroke="#6f8fa5" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M275 247 H320"/><path d="M550 247 H595"/><path d="M825 247 H870"/><path d="M1100 247 H1145"/></g>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial">
    <rect x="55" y="410" width="905" height="270" rx="22" fill="#0a1825" stroke="#334e63"/><text x="82" y="452" fill="#e2e8f0" font-size="16" font-weight="800">DETERMINISTIC HASH LEDGER</text><text x="82" y="481" fill="#89a5b6" font-size="14">Every stage commits to its inputs, outputs, counts, metadata, and the previous entry hash.</text>
    <g font-size="13" font-family="Segoe UI,Arial"><rect x="84" y="520" width="150" height="92" rx="12" fill="#12263a" stroke="#3b82f6"/><text x="104" y="550" fill="#93c5fd" font-weight="800">LOAD HASH</text><text x="104" y="578" fill="#9fb2bf">genesis → h₁</text><rect x="254" y="520" width="150" height="92" rx="12" fill="#211a35" stroke="#a855f7"/><text x="274" y="550" fill="#d8b4fe" font-weight="800">PLAN HASH</text><text x="274" y="578" fill="#9fb2bf">h₁ → h₂</text><rect x="424" y="520" width="150" height="92" rx="12" fill="#0f302e" stroke="#14b8a6"/><text x="444" y="550" fill="#99f6e4" font-weight="800">INDEX HASH</text><text x="444" y="578" fill="#9fb2bf">h₂ → h₃</text><rect x="594" y="520" width="150" height="92" rx="12" fill="#3a2a10" stroke="#f59e0b"/><text x="614" y="550" fill="#fde68a" font-weight="800">RESULT HASH</text><text x="614" y="578" fill="#9fb2bf">h₃ → h₄</text><rect x="764" y="520" width="166" height="92" rx="12" fill="#123120" stroke="#22c55e"/><text x="784" y="550" fill="#bbf7d0" font-weight="800">VERDICT HASH</text><text x="784" y="578" fill="#9fb2bf">h₄ → ROOT</text></g>
    <g stroke="#607f91" stroke-width="2" marker-end="url(#arrow)"><path d="M234 566h16"/><path d="M404 566h16"/><path d="M574 566h16"/><path d="M744 566h16"/></g>
    <rect x="1000" y="410" width="445" height="270" rx="22" fill="#0a1825" stroke="#334e63"/><text x="1028" y="452" fill="#e2e8f0" font-size="16" font-weight="800">BOUNDARY &amp; EXTENSION SURFACES</text><rect x="1028" y="492" width="182" height="72" rx="11" fill="#16293c" stroke="#60a5fa"/><text x="1048" y="521" fill="#bfdbfe" font-size="14" font-weight="750">ADAPTER REGISTRY</text><text x="1048" y="545" fill="#91a9b8" font-size="12">stored sanitized input</text><rect x="1230" y="492" width="187" height="72" rx="11" fill="#2b213c" stroke="#c084fc"/><text x="1250" y="521" fill="#e9d5ff" font-size="14" font-weight="750">OPERATOR REGISTRY</text><text x="1250" y="545" fill="#aa9abb" font-size="12">inspectable predicates</text><rect x="1028" y="584" width="389" height="64" rx="11" fill="#123020" stroke="#22c55e"/><text x="1222" y="612" text-anchor="middle" fill="#bbf7d0" font-size="14" font-weight="750">SIMULATION-ONLY RESPONSE CONTRACT</text><text x="1222" y="634" text-anchor="middle" fill="#8fbea0" font-size="12">no sockets · no subprocesses · no live infrastructure authority</text>
  </g>
  <text x="60" y="724" fill="#7894a5" font-family="Segoe UI,Arial" font-size="14" font-weight="700">THE ENGINE RECORDS WHAT IT DID, WHY IT DID IT, AND THE EXACT SEMANTIC PLAN IT EXECUTED.</text>
</svg>
