<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">SOC_Replay evidence-first cyber range</title>
  <desc id="desc">A physical segmented cyber range feeds sanitized telemetry into a deterministic replay and verification plane.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101c"/>
      <stop offset="0.55" stop-color="#0a1725"/>
      <stop offset="1" stop-color="#102c2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect width="1400" height="720" fill="url(#bg)"/>
  <circle cx="1250" cy="70" r="230" fill="#0f766e" opacity="0.08"/>
  <circle cx="160" cy="690" r="240" fill="#2563eb" opacity="0.07"/>

  <text x="62" y="68" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" letter-spacing="1">SOC_REPLAY</text>
  <text x="62" y="105" fill="#a7bdcb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">EVIDENCE-FIRST CYBER RANGE • SEGMENTED INFRASTRUCTURE • DETERMINISTIC DETECTION REPLAY</text>
  <rect x="62" y="123" width="1276" height="3" rx="2" fill="url(#accent)" opacity="0.85"/>

  <g filter="url(#shadow)">
    <rect x="62" y="158" width="430" height="430" rx="24" fill="#0b1725" stroke="#24435c"/>
    <text x="92" y="198" fill="#60a5fa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.2">PHYSICAL CONTROL PLANE</text>
    <text x="92" y="224" fill="#8da7b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Installed infrastructure, policy boundaries, sensors and recovery</text>

    <rect x="92" y="252" width="170" height="276" rx="16" fill="#101f31" stroke="#31506a"/>
    <text x="112" y="282" fill="#dbeafe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">ENTERPRISE RACK</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">
      <rect x="112" y="302" width="130" height="38" rx="7" fill="#173354"/><text x="127" y="326" fill="#bfdbfe">R710 • Qubes</text>
      <rect x="112" y="350" width="130" height="38" rx="7" fill="#153a2c"/><text x="127" y="374" fill="#bbf7d0">Storage • Proxmox</text>
      <rect x="112" y="398" width="130" height="38" rx="7" fill="#493716"/><text x="127" y="422" fill="#fde68a">X1052P • VLANs</text>
      <rect x="112" y="446" width="130" height="38" rx="7" fill="#4a1d25"/><text x="127" y="470" fill="#fecaca">ASA • Boundary</text>
      <rect x="112" y="494" width="130" height="22" rx="7" fill="#2c2442"/><text x="127" y="510" fill="#e9d5ff" font-size="11">OpenGear • OOB</text>
    </g>

    <rect x="282" y="252" width="180" height="276" rx="16" fill="#101f31" stroke="#31506a"/>
    <text x="302" y="282" fill="#d1fae5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">TRUST ZONES</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700">
      <rect x="302" y="304" width="140" height="34" rx="8" fill="#163a5d" stroke="#3b82f6"/><text x="319" y="326" fill="#bfdbfe">MANAGEMENT</text>
      <rect x="302" y="348" width="140" height="34" rx="8" fill="#173b2e" stroke="#22c55e"/><text x="319" y="370" fill="#bbf7d0">CORE</text>
      <rect x="302" y="392" width="140" height="34" rx="8" fill="#4a3613" stroke="#f59e0b"/><text x="319" y="414" fill="#fde68a">LAB • VLAN 10</text>
      <rect x="302" y="436" width="140" height="34" rx="8" fill="#4b1820" stroke="#ef4444"/><text x="319" y="458" fill="#fecaca">DECEPTION • 20/30</text>
      <rect x="302" y="480" width="140" height="34" rx="8" fill="#15363b" stroke="#14b8a6"/><text x="319" y="502" fill="#ccfbf1">SELKS • SURICATA</text>
    </g>
    <text x="277" y="558" text-anchor="middle" fill="#7e9bac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">SEGMENT • OBSERVE • RECOVER</text>
  </g>

  <g>
    <path d="M510 360 H620" stroke="#5eead4" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="520" y="290" width="92" height="126" rx="18" fill="#0d2730" stroke="#0f766e"/>
    <text x="566" y="320" text-anchor="middle" fill="#99f6e4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="800">SANITIZE</text>
    <text x="566" y="345" text-anchor="middle" fill="#8ec8c3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">NORMALIZE</text>
    <text x="566" y="370" text-anchor="middle" fill="#8ec8c3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">HASH</text>
    <text x="566" y="395" text-anchor="middle" fill="#8ec8c3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">REPLAY</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="632" y="158" width="706" height="430" rx="24" fill="#0b1725" stroke="#24435c"/>
    <text x="662" y="198" fill="#34d399" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="1.2">DETERMINISTIC EVIDENCE PLANE</text>
    <text x="662" y="224" fill="#8da7b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Inspectable contracts turn normalized events into repeatable, machine-verifiable decisions</text>

    <rect x="662" y="252" width="196" height="118" rx="16" fill="#11283b" stroke="#2563eb"/>
    <text x="682" y="282" fill="#bfdbfe" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">SCENARIO CONTRACT</text>
    <text x="682" y="310" fill="#91abc0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">rules + boundary</text>
    <text x="682" y="334" fill="#91abc0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">expected detections</text>
    <text x="682" y="356" fill="#91abc0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">input provenance</text>

    <path d="M870 311 H920" stroke="#647f91" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="930" y="252" width="196" height="118" rx="16" fill="#173329" stroke="#10b981"/>
    <text x="950" y="282" fill="#bbf7d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">REPLAY ENGINE</text>
    <text x="950" y="310" fill="#96c4aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">field conditions</text>
    <text x="950" y="334" fill="#96c4aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">window correlation</text>
    <text x="950" y="356" fill="#96c4aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">stable ordering</text>

    <path d="M1138 311 H1188" stroke="#647f91" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1198" y="252" width="110" height="118" rx="16" fill="#302447" stroke="#a855f7"/>
    <text x="1253" y="282" text-anchor="middle" fill="#f3e8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800">VERDICT</text>
    <text x="1253" y="319" text-anchor="middle" fill="#86efac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="900">PASS</text>
    <text x="1253" y="347" text-anchor="middle" fill="#c4b5d5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">expected = actual</text>

    <rect x="662" y="400" width="646" height="128" rx="16" fill="#0e222f" stroke="#27475e"/>
    <text x="682" y="430" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">EVIDENCE REPORT</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">
      <rect x="682" y="450" width="142" height="52" rx="10" fill="#142d42"/><text x="700" y="472" fill="#dbeafe" font-weight="700">RUN ID</text><text x="700" y="491" fill="#8fa9bb">deterministic</text>
      <rect x="838" y="450" width="142" height="52" rx="10" fill="#142d42"/><text x="856" y="472" fill="#dbeafe" font-weight="700">SHA-256</text><text x="856" y="491" fill="#8fa9bb">exact inputs</text>
      <rect x="994" y="450" width="142" height="52" rx="10" fill="#142d42"/><text x="1012" y="472" fill="#dbeafe" font-weight="700">EVENT IDS</text><text x="1012" y="491" fill="#8fa9bb">traceable evidence</text>
      <rect x="1150" y="450" width="138" height="52" rx="10" fill="#15372f"/><text x="1168" y="472" fill="#bbf7d0" font-weight="700">SIMULATED</text><text x="1168" y="491" fill="#8fc4aa">response only</text>
    </g>
    <text x="985" y="557" text-anchor="middle" fill="#7896a7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">REPLAY • VERIFY • EXPLAIN • PACKAGE</text>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="62" y="636" fill="#94a3b8" font-size="13" font-weight="800" letter-spacing="1">EVIDENCE MATURITY</text>
    <rect x="62" y="654" width="1276" height="34" rx="12" fill="#0b1b28" stroke="#203c51"/>
    <text x="100" y="676" fill="#93c5fd" font-size="12" font-weight="700">INSTALLED</text>
    <text x="258" y="676" fill="#7dd3fc" font-size="12" font-weight="700">CONFIGURED</text>
    <text x="430" y="676" fill="#5eead4" font-size="12" font-weight="700">OBSERVED</text>
    <text x="590" y="676" fill="#6ee7b7" font-size="12" font-weight="700">REPLAYED</text>
    <text x="744" y="676" fill="#86efac" font-size="12" font-weight="700">VERIFIED</text>
    <text x="900" y="676" fill="#c4b5fd" font-size="12" font-weight="700">EXPLAINED</text>
    <text x="1068" y="676" fill="#f0abfc" font-size="12" font-weight="700">REPRODUCIBLE</text>
    <path d="M180 671h54M350 671h54M510 671h54M662 671h54M816 671h54M982 671h54M1170 671h118" stroke="#476476" stroke-width="2"/>
  </g>
</svg>