<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="t d"><title id="t">SOC_Replay platform overview</title><desc id="d">Physical rack, trust zones, telemetry and evidence replay layers.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#102a2a"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".35"/></filter></defs><rect width="1400" height="720" fill="url(#bg)"/><text x="64" y="72" fill="#f8fafc" font-family="Segoe UI,Arial" font-size="36" font-weight="800">SOC_REPLAY</text><text x="64" y="108" fill="#9fb7c8" font-family="Segoe UI,Arial" font-size="19">PHYSICAL CYBER RANGE • SEGMENTED TRUST ZONES • DEDICATED SOC • RECOVERABLE EXPERIMENTS</text><g filter="url(#s)"><rect x="64" y="148" width="332" height="492" rx="22" fill="#0b1726" stroke="#29445f"/><text x="92" y="188" fill="#60a5fa" font-family="Segoe UI,Arial" font-size="16" font-weight="800">PHYSICAL RACK</text><g font-family="Segoe UI,Arial" font-size="15" fill="#e5edf5"><rect x="92" y="216" width="276" height="46" rx="9" fill="#142b43"/><text x="112" y="245">R710 • Qubes secure compute</text><rect x="92" y="274" width="276" height="46" rx="9" fill="#16372f"/><text x="112" y="303">EqualLogic + Avid • Proxmox</text><rect x="92" y="332" width="276" height="46" rx="9" fill="#2d2b15"/><text x="112" y="361">X1052P • VLAN core</text><rect x="92" y="390" width="276" height="62" rx="9" fill="#391a21"/><text x="112" y="418">ASA 5510 / 5515-X</text><text x="112" y="440">SonicWall SRA 4200</text><rect x="92" y="464" width="276" height="46" rx="9" fill="#26213a"/><text x="112" y="493">OpenGear + KVM • OOB</text><rect x="92" y="522" width="276" height="70" rx="9" fill="#15363b"/><text x="112" y="550">Toughbook • SELKS</text><text x="112" y="574">Suricata SOC node</text></g></g><g filter="url(#s)"><rect x="424" y="148" width="472" height="492" rx="